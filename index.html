<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · FlexIt</title>
<meta name="description" content="FlexIt Legal">
<link rel="icon" href="fitlock-icon.png">
<style>
:root{--bg:#F6FAF8;--card:#FFFFFF;--text:#0F1A17;--muted:#4B5B55;--line:#DCE8E2;
--primary:#047857;--accent:#C2410C;--chip:#D1FAE5}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#131D2F;--text:#E6EDF5;
--muted:#9AA8BA;--line:#26344B;--primary:#34D399;--accent:#FB923C;--chip:#064E3B}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,#047857,#0F766E);color:#fff}
.bar{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:12px}
.bar img{width:40px;height:40px;border-radius:10px}
.bar a{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
nav{max-width:760px;margin:0 auto;padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:8px}
nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;
border-radius:999px;background:rgba(255,255,255,.16)}
nav a[aria-current]{background:#fff;color:#047857}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
h1{font-size:28px;line-height:1.25;margin:0 0 4px}
h2{font-size:20px;margin:32px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:20px 0 6px}
a{color:var(--primary)}
em:first-of-type{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:150px}
th{background:var(--chip)}
code{font-size:.9em;background:var(--chip);padding:1px 5px;border-radius:6px}
blockquote{margin:12px 0;padding:8px 14px;border-left:4px solid var(--accent);color:var(--muted)}
.cards{display:grid;gap:12px}
.cards a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;
padding:16px 18px;text-decoration:none;color:var(--text)}
.cards b{display:block;color:var(--primary);font-size:18px}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="bar"><img src="fitlock-icon.png" alt=""><a href="index.html">FlexIt</a></div>
  <nav><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-use.html">Terms of Use</a><a href="health-disclaimer.html">Health Disclaimer</a></nav>
</header>
<main><h1>FlexIt legal information</h1><p>FlexIt has no accounts and no servers. Everything stays on your phone.</p><div class="cards"><a href="privacy-policy.html"><b>Privacy Policy</b></a><a href="terms-of-use.html"><b>Terms of Use</b></a><a href="health-disclaimer.html"><b>Health Disclaimer</b></a></div></main>
<footer>FlexIt · Contact: <a href="mailto:fitapp.cool@gmail.com">fitapp.cool@gmail.com</a></footer>
</body>
</html>
